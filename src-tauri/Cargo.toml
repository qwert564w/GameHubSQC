[package]
name = "xqc-launcher"
version = "1.0.0"
edition = "2021"

[lib]
name = "xqc_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
dirs = "5"
sha2 = "0.10"
hex = "0.4"
aes-gcm = "0.10"
rand = "0.8"
semver = "1"
open = "5"
sysinfo = "0.32"

[profile.release]
lto = true
opt-level = 3
strip = true
panic = 'abort'