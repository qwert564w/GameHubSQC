name: Build and Release

on:
  push:
    tags:
      - 'v*'  # Триггерится на создание тега вида v1.0.0
  # ИЛИ раскомментируй строку ниже для авто-релиза при пуше в main
  # push:
  #   branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm install

      - name: Build Tauri
        run: npm run tauri build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: src-tauri/target/release/bundle/nsis/*.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer as artifact (для тестов)
        uses: actions/upload-artifact@v4
        with:
          name: xqc-launcher-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 30
