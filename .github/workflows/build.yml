name: Build XQC Launcher

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Create valid placeholder icon
        run: |
          New-Item -ItemType Directory -Force -Path "src-tauri/icons"
          $iconBase64 = "......"
          # Примечание: выше сокращено для читаемости, но в коде ниже полная строка!
        shell: pwsh
