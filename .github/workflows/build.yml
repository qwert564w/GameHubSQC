name: Build XQC Launcher

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          
      - name: Install frontend dependencies
        run: npm install
        
      - name: Generate app icons
        run: |
          New-Item -ItemType Directory -Force -Path "src-tauri/icons"
          Add-Type -AssemblyName System.Drawing
          $bmp = New-Object System.Drawing.Bitmap(1024,1024)
          $graphics = [System.Drawing.Graphics]::FromImage($bmp)
          $graphics.Clear([System.Drawing.Color]::FromArgb(102,192,244))
          $bmp.Save("$PWD\src-tauri\icons\icon.png", [System.Drawing.Imaging.ImageFormat]::Png)
          $graphics.Dispose()
          $bmp.Dispose()
          npx tauri icon src-tauri/icons/icon.png
        shell: pwsh
        
      - name: Build Tauri app
        run: npm run tauri build
        
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: xqc-launcher-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 30
