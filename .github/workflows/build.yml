name: Build XQC Launcher

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          
      - name: Download default icon (fallback)
        run: |
          New-Item -ItemType Directory -Force -Path "src-tauri/icons"
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/tauri-apps/tauri/dev/tooling/cli/templates/app-icon/icon.ico" -OutFile "src-tauri/icons/icon.ico"
          
      - run: npm install
      - run: npm run tauri build
      
      - uses: actions/upload-artifact@v4
        with:
          name: xqc-launcher-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 30
