name: Build XQC Launcher

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Create icon directory and placeholder icon
        run: |
          New-Item -ItemType Directory -Force -Path "src-tauri/icons"
          $iconBase64 = "......"
          [System.IO.File]::WriteAllBytes("$PWD\src-tauri\icons\icon.ico", [System.Convert]::FromBase64String($iconBase64))
        shell: pwsh

      - name: Install frontend dependencies
        run: npm install

      - name: Build Tauri app
        run: npm run tauri build

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: xqc-launcher-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 30
